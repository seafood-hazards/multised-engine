url: https://seafood-hazards.github.io/multised-engine/

# `docs/` already holds the specification documents, so the generated site goes
# in a subdirectory rather than over the top of them.
destination: docs/site

template:
  bootstrap: 5

navbar:
  structure:
    left:  [articles, reference]
    right: [search, github]

# Pipeline order, not alphabetical: an article is only useful after the one
# feeding it. Articles under vignettes/articles/ are addressed as
# `articles/<name>`, which is what pkgdown::as_pkgdown(".")$vignettes reports.
articles:
- title: Building the databases
  navbar: Generations
  desc: >
    One article per generation, in the order they run. Each carries the expected
    row counts and what a rebuild should, and should not, reproduce.
  contents:
  - articles/pilot
  - articles/slim
  - articles/clean
  - articles/merged
  - articles/refined

- title: Using them
  navbar: Analyses
  desc: >
    Read-only analyses on a finished database, one article per generation: what
    each reads, what it writes, and which site it feeds. The flat export is
    covered with the refined analyses.
  contents:
  - articles/analyses-clean
  - articles/analyses-merged
  - articles/analyses-refined

reference:
- title: Building a database
  desc: >
    One verb covers all five generations. The listing helpers are executable
    versions of the tables in the articles.
  contents:
  - create_db
  - multised_sources
  - slim_steps

- title: Analysing and exporting
  desc: >
    Analyses read a finished database and never modify it, so re-running is
    always safe. The flat export denormalises rather than computing, which is
    why it is a separate verb.
  contents:
  - analyze_data
  - analysis_modules
  - export_data

- title: Configuration
  desc: >
    Where the databases, analysis outputs, raw exports and seastamp reference
    data live, and how to point at the seastamp binary.
  contents:
  - multised_db_dir

- title: Location annotation
  contents:
  - seastamp_enrich

- title: Package
  contents:
  - multised.engine-package
